<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breeeeeath</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Fredoka', sans-serif;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg, #9B96C2 0%, #5B8282 60%, #4a7272 100%);
    overflow: hidden; user-select: none;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; background: white; border-radius: 50%; opacity: 0;
    animation: twinkle var(--dur) var(--delay) infinite ease-in-out;
  }
  @keyframes twinkle {
    0%,100%{ opacity:0; transform:scale(0.6); }
    50%    { opacity:var(--max-op); transform:scale(1); }
  }
  .ground { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1; pointer-events: none; }

  .scene {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 380px;
    padding: 2rem 1rem 120px;
  }
  .title {
    color: rgba(255,255,255,0.95);
    font-size: clamp(1.8rem, 6vw, 2.2rem);
    font-weight: 500; letter-spacing: 0.06em; text-align: center;
    margin-bottom: 1.6rem;
    opacity: 0; animation: fadeUp 0.8s 0.3s ease forwards;
    text-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  /* The main sheep SVG — all layers inside one coordinate space */
  .sheep-stage {
    position: relative;
    width: 280px; height: 280px;
    -webkit-tap-highlight-color: transparent;
    opacity: 0; animation: fadeUp 0.9s 0.5s ease forwards;
  }

  /* Ring SVG sits absolutely behind the sheep SVG */
  .ring-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transform: rotate(-90deg);
    pointer-events: none; z-index: 0;
  }
  .arc-track    { fill: none; stroke: rgba(255,255,255,0.22); stroke-width: 4; }
  .arc-progress {
    fill: none; stroke: rgba(255,255,255,0.72); stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 785;
    stroke-dashoffset: 785;
    transition: stroke 0.5s;
  }
  .ring-pulse-el {
    fill: none; stroke: rgba(255,255,255,0.3); stroke-width: 2;
    transform-origin: 140px 140px;
  }

  /* Sheep SVG on top */
  .sheep-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    overflow: visible; z-index: 1;
  }

  /* The cuerpo group — transform-origin at its visual bottom-center */
  #g-cuerpo {
    transform-origin: 140px 195px; /* bottom-center of cuerpo in 280×280 space */
    transition: none;
  }
  #g-sombra {
    transform-origin: 140px 240px;
    transition: none;
  }

  .phase-label {
    margin-top: 1.4rem;
    color: rgba(255,255,255,0.92);
    font-size: 1.1rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    min-height: 1.5rem; text-align: center;
    transition: opacity 0.35s ease;
  }
  .timer-dots { display: flex; gap: 7px; margin-top: 0.7rem; min-height: 10px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.28);
    transition: background 0.3s, transform 0.3s;
  }
  .dot.active { background: rgba(255,255,255,0.92); transform: scale(1.25); }

  .cta { margin-top: 1.4rem; opacity: 0; animation: fadeUp 0.9s 0.8s ease forwards; }
  .cta-btn {
    color: rgba(255,255,255,0.9); font-family: 'Fredoka', sans-serif;
    font-size: 1rem; font-weight: 500; letter-spacing: 0.08em;
    padding: 0.45rem 1.8rem;
    border: 1.5px solid rgba(255,255,255,0.38); border-radius: 100px;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
    cursor: pointer; transition: background 0.2s, transform 0.15s;
  }
  .cta-btn:active { transform: scale(0.97); background: rgba(255,255,255,0.2); }

  .counter {
    position: fixed; top: 1.2rem; right: 1.2rem;
    color: rgba(255,255,255,0.4); font-family: 'Fredoka', sans-serif;
    font-size: 0.8rem; letter-spacing: 0.06em; z-index: 10;
  }

  /* Pause button — replaces the old stop-hint */
  .pause-btn {
    position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.9); font-family: 'Fredoka', sans-serif;
    font-size: 0.9rem; font-weight: 500; letter-spacing: 0.08em;
    padding: 0.4rem 1.6rem;
    border: 1.5px solid rgba(255,255,255,0.38); border-radius: 100px;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
    cursor: pointer; transition: background 0.2s, transform 0.15s, opacity 0.5s;
    opacity: 0; pointer-events: none;
    z-index: 10; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .pause-btn:hover { background: rgba(255,255,255,0.18); }
  .pause-btn:active { transform: translateX(-50%) scale(0.97); background: rgba(255,255,255,0.22); }
  .pause-btn.visible { opacity: 1; pointer-events: auto; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

  <div class="phase-label" id="phaseLabel"></div>
  <div class="timer-dots"  id="timerDots"></div>

<button class="pause-btn" id="pauseBtn">Pausar</button>
<div class="counter" id="counter"></div>

<script>
// Stars
const starsEl = document.getElementById('starsContainer');
for (let i = 0; i < 55; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random()*3+1.5;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*72}%;left:${Math.random()*100}%;--dur:${2.5+Math.random()*4}s;--delay:${Math.random()*5}s;--max-op:${0.3+Math.random()*0.6}`;
  starsEl.appendChild(s);
}

// Config
const PHASES = [
  { name:'Inhala',  duration:4000, type:'inhale',  dots:4 },
  { name:'Aguanta', duration:4000, type:'hold',    dots:4 },
  { name:'Exhala',  duration:6000, type:'exhale',  dots:6 },
  { name:'Pausa',   duration:2000, type:'pause',   dots:2 },
];
const TOTAL = PHASES.reduce((a,p)=>a+p.duration,0);
const ARC_C = 2*Math.PI*125;

// DOM
const gCuerpo    = document.getElementById('g-cuerpo');
const gSombra    = document.getElementById('g-sombra');
const arcProg    = document.getElementById('arcProgress');
const ringPulseEl= document.getElementById('ringPulseEl');
const phaseLabel = document.getElementById('phaseLabel');
const timerDots  = document.getElementById('timerDots');
const ctaArea    = document.getElementById('ctaArea');
const ctaBtn     = document.getElementById('ctaBtn');
const pauseBtn   = document.getElementById('pauseBtn');
const counter    = document.getElementById('counter');

let running=false, rafId=null, cycleStart=0, cycleCount=0, lastPhaseType=null;

function eio(t){ return t<0.5?2*t*t:-1+(4-2*t)*t; }
function lerp(a,b,t){ return a+(b-a)*t; }

function setBodyScale(sx,sy){
  gCuerpo.style.transform=`scale(${sx},${sy})`;
}
function setShadowScale(sx,sy){
  gSombra.style.transform=`scale(${sx},${sy})`;
}
function setArc(f){
  arcProg.style.strokeDashoffset=ARC_C*(1-f);
}

function setPulse(on){
  if(on){
    ringPulseEl.style.animation='ringPulse 1.6s ease-out infinite';
  } else {
    ringPulseEl.style.animation='none';
    ringPulseEl.style.opacity='0';
  }
}

function setPhaseUI(p){
  phaseLabel.style.opacity='0';
  setTimeout(()=>{
    phaseLabel.textContent=p?p.name.toUpperCase():'';
    phaseLabel.style.opacity='1';
    timerDots.innerHTML='';
    if(p){ for(let i=0;i<p.dots;i++){ const d=document.createElement('div'); d.className='dot'; timerDots.appendChild(d); } }
  },180);
}
function updateDots(t){
  const dots=timerDots.querySelectorAll('.dot');
  if(!dots.length)return;
  const active=Math.floor(t*dots.length);
  dots.forEach((d,i)=>d.classList.toggle('active',i<=active));
}

function tick(ts){
  if(!running)return;
  const elapsed=(ts-cycleStart)%TOTAL;
  let acc=0, phase=PHASES[0], pe=0;
  for(let i=0;i<PHASES.length;i++){
    if(elapsed<acc+PHASES[i].duration){phase=PHASES[i];pe=elapsed-acc;break;}
    acc+=PHASES[i].duration;
  }
  const t=pe/phase.duration;
  setArc(elapsed/TOTAL);
  updateDots(t);

  if(phase.type==='inhale'){
    const e=eio(t);
    setBodyScale(lerp(1,1.20,e), lerp(1,1.18,e));
    setShadowScale(lerp(1,1.22,e), lerp(1,1.1,e));
    setPulse(false);
    arcProg.style.stroke='rgba(180,210,240,0.8)';
  } else if(phase.type==='hold'){
    setBodyScale(1.20,1.18);
    setShadowScale(1.22,1.1);
    setPulse(true);
    arcProg.style.stroke='rgba(210,235,255,0.9)';
  } else if(phase.type==='exhale'){
    const e=eio(t);
    setBodyScale(lerp(1.20,1,e), lerp(1.18,1,e));
    setShadowScale(lerp(1.22,1,e), lerp(1.1,1,e));
    setPulse(false);
    arcProg.style.stroke='rgba(255,255,255,0.58)';
  } else {
    setBodyScale(1,1); setShadowScale(1,1); setPulse(false);
  }

  if(phase.type!==lastPhaseType){
    lastPhaseType=phase.type;
    setPhaseUI(phase);
    if(phase.type==='inhale'){
      cycleCount++;
      counter.textContent=`${cycleCount} respiración${cycleCount!==1?'es':''}`;
    }
  }
  rafId=requestAnimationFrame(tick);
}

function start(){
  running=true; cycleStart=performance.now(); lastPhaseType=null;
  ctaArea.style.visibility='hidden';
  pauseBtn.classList.add('visible');
  pauseBtn.textContent='Pausar';
  setPhaseUI(PHASES[0]);
  rafId=requestAnimationFrame(tick);
}

function stop(){
  running=false; cancelAnimationFrame(rafId);
  setArc(0); setPulse(false);
  setBodyScale(1,1); setShadowScale(1,1);
  setPhaseUI(null); timerDots.innerHTML='';
  cycleCount=0; counter.textContent='';
  ctaArea.style.visibility='visible';
  pauseBtn.classList.remove('visible');
  lastPhaseType=null;
}

ctaBtn.addEventListener('click', start);
pauseBtn.addEventListener('click', stop);
setArc(0);
</script>

<style>
  @keyframes ringPulse {
    0%   { transform:scale(1);   opacity:0.6; }
    100% { transform:scale(1.8); opacity:0; }
  }
  #ringPulseEl { transform-box: fill-box; transform-origin: center; }
</style>
</body>
